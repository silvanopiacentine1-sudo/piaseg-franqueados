services:
  - type: web
    name: piaseg-franqueados-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    filter:
      paths:
        - backend/**
    disk:
      name: piaseg-franqueados-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
